name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Each generator may fail on its own; the previous SVG stays in the repository.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=redgp0g&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=percentile&locale=en&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        continue-on-error: true
        with:
          options: user=redgp0g&locale=en&hide_border=true&theme=transparent
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # The streak generator can silently skip a year when the API hiccups.
      # Contributions almost never decrease, so a drop above 5% means bad data.
      - name: Keep previous streak card if the total dropped
        run: |
          total() { sed 's/<[^>]*>/ /g' "$1" | tr -s ' \n' ' ' | grep -o '[0-9,]* Total Contributions' | tr -dc '0-9'; }
          git show HEAD:profile/streak.svg > "$RUNNER_TEMP/old-streak.svg" 2>/dev/null || exit 0
          old=$(total "$RUNNER_TEMP/old-streak.svg")
          new=$(total profile/streak.svg)
          echo "Previous total: ${old:-?} | New total: ${new:-?}"
          if [ -n "$old" ] && [ -n "$new" ] && [ $((new * 100)) -lt $((old * 95)) ]; then
            echo "::warning::Streak total dropped from $old to $new; keeping the previous card."
            git checkout -- profile/streak.svg
          fi

      - name: Generate contribution snake
        uses: Platane/snk@v3.5.0
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
